# Projeto de DEV TOOLING do workspace (raiz do repo git).
#
# Escopo: utilitários de desenvolvimento que operam sobre o repositório inteiro
# (não a aplicação). A aplicação QA Platform vive em `code/` e tem o seu próprio
# `pyproject.toml`; este arquivo NÃO a substitui nem a empacota.
#
# Fornece o comando `commit`, executável com `uv run commit` a partir da raiz do
# repo, que dispara o fluxo commit/push/PR de `scripts/commit_flow.py`.
[project]
name = "qa-platform-devtools"
version = "0.0.0"
description = "Ferramentas de desenvolvimento do workspace QA Platform (fluxo de commit)."
requires-python = ">=3.12"
# Sem dependências: o fluxo de commit usa apenas a biblioteca padrão.
dependencies = []

[project.scripts]
# `uv run commit` -> chama commit_flow.main(). O módulo vem de `scripts/`.
commit = "commit_flow:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Empacota o módulo único `scripts/commit_flow.py` como top-level `commit_flow`,
# sem arrastar o resto de `scripts/` (que são shell scripts, não Python).
include = ["scripts/commit_flow.py"]
sources = ["scripts"]
