# =============================================================================
# QA Platform — Dependency_Environment (ambiente local de dependências)
#
# ONDE: este arquivo vive em `code/` — a raiz ÚNICA de tudo que é implementado
# na QA Platform (código, IaC, compose, testes). Rode os comandos a partir de
# `code/`.
#
# Sobe as tecnologias de terceiros necessárias para desenvolver e observar a
# plataforma localmente, SEM custo e SEM rede externa. O conjunto de serviços é o
# PADRÃO do portfólio (mesmo do agente de referência): LocalStack + Ollama +
# AgentOS + observabilidade (SigNoz | Grafana | Langfuse) + pgvector. Para não
# pesar no fluxo padrão, tudo além do LocalStack fica atrás de PERFIS do Compose:
# o `docker compose up` puro sobe apenas o núcleo (LocalStack) e alcança healthy;
# os demais serviços são opt-in por `--profile`.
#
# Perfis:
#   (padrão, sem --profile)  -> LocalStack (núcleo mínimo, alcança healthy)
#   --profile llm            -> Ollama (provider de LLM local / fallback)
#   --profile agentos        -> AgentOS (acompanhamento de runs na 7777)
#   --profile signoz         -> SigNoz (backend OTLP tudo-em-um)
#   --profile grafana        -> OTel Collector + Grafana + Tempo + Loki + Prometheus
#   --profile langfuse       -> Langfuse (tracing focado em LLM; portas próprias)
#   --profile pgvector       -> Postgres + extensão pgvector (RAG com PgVector)
#
# Exemplos de uso (a partir de `code/`):
#   docker compose up                                   # só LocalStack (padrão)
#   docker compose --profile llm --profile agentos up   # + Ollama + AgentOS
#   docker compose --profile signoz up                  # + backend OTLP SigNoz
#   docker compose --profile grafana up                 # + stack Grafana
#   docker compose config                               # valida a sintaxe
#   docker compose down                                 # derruba o ambiente
#
# CONFLITO DE PORTA OTLP (intencional): SigNoz (perfil `signoz`) e o OTel
# Collector (perfil `grafana`) publicam o MESMO par de portas OTLP no host —
# 4317 (gRPC) e 4318 (HTTP). Escolha UM backend de tracing OTLP por vez; ativar
# os dois ao mesmo tempo falha o bind da porta, sinalizando o conflito. O
# `langfuse` usa portas próprias (3100) e pode subir junto.
#
# Endpoints por env: o código lê AWS_ENDPOINT_URL, OTEL_EXPORTER_OTLP_ENDPOINT e
# OLLAMA_HOST do ambiente (ver `.env.example`) — o código NÃO muda entre local e
# produção; troca-se apenas a variável de ambiente.
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # LocalStack — AWS emulada (NÚCLEO, sem perfil: sobe sempre).
  # Serviços habilitados: apigateway, lambda, dynamodb, secretsmanager, ssm, s3.
  # O script de bootstrap (localstack/init/01-bootstrap.sh) é montado em
  # /etc/localstack/init/ready.d e roda quando o LocalStack fica pronto, criando
  # o segredo de forma idempotente. A porta edge (4566) atende todos os serviços
  # AWS e é publicada no host via LOCALSTACK_PORT (default 4566).
  # ---------------------------------------------------------------------------
  localstack:
    # Tag estável fixada (nunca `latest` para reprodutibilidade do núcleo).
    image: localstack/localstack:3.8
    ports:
      # host (configurável por env, default 4566) -> container 4566 (edge port)
      - "${LOCALSTACK_PORT:-4566}:4566"
    environment:
      - SERVICES=apigateway,lambda,dynamodb,secretsmanager,ssm,s3
      - DEBUG=0
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-us-east-1}
    volumes:
      # Script de bootstrap idempotente executado quando o LocalStack fica pronto.
      - ./localstack/init:/etc/localstack/init/ready.d
      # Socket do Docker para o serviço de Lambda do LocalStack.
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      # `healthy` só quando o endpoint de saúde responde 200.
      test: ["CMD-SHELL", "curl -sf http://localhost:4566/_localstack/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      # Janela de inicialização: falhas aqui não contam como unhealthy. Combinado
      # com interval/retries, o serviço alcança `healthy` bem dentro de 120s.
      start_period: 60s

  # ---------------------------------------------------------------------------
  # Ollama — provider de LLM local / fallback (perfil `llm`)
  # O código aponta para ele via OLLAMA_HOST (ex.: http://ollama:11434 na rede
  # do Compose, ou http://localhost:11434 a partir do host).
  # ---------------------------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    profiles: ["llm"]
    ports:
      - "11434:11434"
    volumes:
      # Persiste os modelos baixados entre reinícios (evita re-download).
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # AgentOS — acompanhamento da plataforma na porta 7777 (perfil `agentos`)
  # "Veste" o agente montado pelo composition_root, sem duplicar domínio. Como o
  # Dockerfile de produção é do caminho Lambda, aqui usamos uma imagem Python
  # enxuta e instalamos o projeto com uv para servir a app FastAPI com uvicorn.
  # ---------------------------------------------------------------------------
  agentos:
    image: python:3.12-slim
    profiles: ["agentos"]
    working_dir: /app
    command: >
      bash -c "pip install --no-cache-dir uv &&
               uv sync &&
               uv run python -m uvicorn agentos.app:app --host 0.0.0.0 --port 7777"
    ports:
      - "7777:7777"
    volumes:
      - ./:/app
      # Volume anônimo mascara o .venv do HOST (criado no Windows) para que ele
      # NÃO vaze para dentro do container. Sem isto, `uv sync` no container Linux
      # tenta manipular o .venv do Windows montado via bind e falha com
      # "failed to remove directory /app/.venv/Lib: Input/output error".
      # Assim o container cria e usa o próprio .venv Linux, isolado do host.
      - /app/.venv
    environment:
      # Endpoints por env — nomes das vars vindos de `.env.example`.
      - MODEL_PROVIDER_ORDER=${MODEL_PROVIDER_ORDER:-openai,ollama}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      # Dentro da rede do Compose os serviços se enxergam pelo nome.
      - OLLAMA_HOST=${OLLAMA_HOST:-http://ollama:11434}
      - AWS_ENDPOINT_URL=${AWS_ENDPOINT_URL:-http://localstack:4566}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-test}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-test}
      # Endpoint OTLP: aponta para o backend de observabilidade ativo (SigNoz ou
      # o OTel Collector no perfil grafana — ambos escutam em 4317).
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
      - ENVIRONMENT=${ENVIRONMENT:-local}
    depends_on:
      - localstack

  # ---------------------------------------------------------------------------
  # Observabilidade — perfil `signoz`: SigNoz (backend OTLP tudo-em-um)
  # Recebe traces/logs/métricas via OTLP nas portas 4317 (gRPC) e 4318 (HTTP).
  # Ocupa as MESMAS portas OTLP que o OTel Collector do perfil grafana — só um
  # backend OTLP por vez.
  # ---------------------------------------------------------------------------
  signoz:
    image: signoz/signoz-otel-collector:latest
    profiles: ["signoz"]
    ports:
      - "4317:4317" # OTLP gRPC  (conflita de propósito com otel-collector)
      - "4318:4318" # OTLP HTTP
      - "3301:3301" # UI do SigNoz
    volumes:
      - signoz-data:/var/lib/signoz

  # ---------------------------------------------------------------------------
  # Observabilidade — perfil `grafana`: OTel Collector + Grafana + Tempo + Loki + Prometheus
  # O Collector recebe OTLP e faz fan-out dos três sinais para os backends
  # dedicados. Config em otel/collector-config.yaml e datasources do Grafana em
  # grafana/datasources.yaml.
  # ---------------------------------------------------------------------------
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    profiles: ["grafana"]
    command: ["--config=/etc/otel/collector-config.yaml"]
    volumes:
      - ./otel/collector-config.yaml:/etc/otel/collector-config.yaml:ro
    ports:
      - "4317:4317" # OTLP gRPC  (mesma porta do SigNoz — só um por vez)
      - "4318:4318" # OTLP HTTP
    depends_on:
      - tempo
      - loki
      - prometheus

  tempo:
    image: grafana/tempo:latest
    profiles: ["grafana"]
    command: ["-target=all", "-storage.trace.backend=local", "-storage.trace.local.path=/var/tempo"]
    volumes:
      - tempo-data:/var/tempo

  loki:
    image: grafana/loki:latest
    profiles: ["grafana"]
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - loki-data:/loki

  prometheus:
    image: prom/prometheus:latest
    profiles: ["grafana"]
    volumes:
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:latest
    profiles: ["grafana"]
    ports:
      - "3000:3000" # UI do Grafana
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    volumes:
      # Datasources Tempo/Loki/Prometheus provisionados.
      - ./grafana/datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - tempo
      - loki
      - prometheus

  # ---------------------------------------------------------------------------
  # Observabilidade — perfil `langfuse` (opcional/adicional): tracing focado em LLM
  # Usa portas próprias (3100 no host), então pode subir junto de SigNoz ou da
  # stack Grafana sem conflito de porta OTLP.
  # ---------------------------------------------------------------------------
  langfuse-db:
    image: postgres:16-alpine
    profiles: ["langfuse"]
    environment:
      - POSTGRES_USER=langfuse
      - POSTGRES_PASSWORD=langfuse
      - POSTGRES_DB=langfuse
    volumes:
      - langfuse-db-data:/var/lib/postgresql/data

  langfuse:
    image: langfuse/langfuse:latest
    profiles: ["langfuse"]
    ports:
      - "3100:3000" # UI do Langfuse (porta própria, sem conflito com Grafana/SigNoz)
    environment:
      - DATABASE_URL=postgresql://langfuse:langfuse@langfuse-db:5432/langfuse
      - NEXTAUTH_URL=http://localhost:3100
      - NEXTAUTH_SECRET=local-dev-secret
      - SALT=local-dev-salt
    depends_on:
      - langfuse-db

  # ---------------------------------------------------------------------------
  # RAG — perfil `pgvector`: Postgres com a extensão pgvector para vector DB.
  # A imagem `pgvector/pgvector` já traz a extensão; o script de init cria
  # `CREATE EXTENSION IF NOT EXISTS vector` (idempotente). Porta 5433 no host
  # para não colidir com Postgres locais (5432).
  # ---------------------------------------------------------------------------
  pgvector:
    image: pgvector/pgvector:pg16
    profiles: ["pgvector"]
    ports:
      - "5433:5432" # host 5433 -> container 5432 (evita conflito com 5432 local)
    environment:
      - POSTGRES_USER=${RAG_PG_USER:-rag}
      - POSTGRES_PASSWORD=${RAG_PG_PASSWORD:-rag}
      - POSTGRES_DB=${RAG_PG_DB:-rag}
    volumes:
      - pgvector-data:/var/lib/postgresql/data
      # Habilita a extensão `vector` no primeiro boot (idempotente).
      - ./pgvector/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${RAG_PG_USER:-rag} -d ${RAG_PG_DB:-rag}"]
      interval: 10s
      timeout: 5s
      retries: 5

# =============================================================================
# Volumes nomeados — persistem dados/modelos entre reinícios do Compose.
# =============================================================================
volumes:
  ollama-models:
  signoz-data:
  tempo-data:
  loki-data:
  prometheus-data:
  grafana-data:
  langfuse-db-data:
  pgvector-data:
