# Hooks de qualidade de codigo executados LOCALMENTE antes de cada commit.
# Rodam sem gasto de token de LLM. As versoes sao fixadas por hook para
# garantir reprodutibilidade entre maquinas.
#
# IMPORTANTE: o repositorio git esta na RAIZ do workspace, mas o projeto Python
# vive em `code/`. Por isso os hooks sao escopados a `code/` (via `files:`) e os
# que dependem de config relativa (import-linter, bandit) rodam a partir de
# `code/`. Isso evita varrer `.kiro/skills/` e outros diretorios fora do projeto.
#
# Instalacao (uma vez por clone), a partir da RAIZ do repositorio:
#   uv run --project code pre-commit install
#   uv run --project code pre-commit install --hook-type commit-msg
# Rodar em tudo manualmente (a partir da raiz):
#   uv run --project code pre-commit run --all-files

repos:
  # Higiene geral de arquivos (escopada ao projeto em code/).
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        files: ^code/
      - id: end-of-file-fixer
        files: ^code/
      - id: check-yaml
        files: ^code/
        # template.yaml usa tags intrinsecas do CloudFormation/SAM (!Sub, !Ref,
        # !GetAtt), que o parser padrao nao reconhece — --unsafe apenas checa a
        # sintaxe YAML sem resolver as tags.
        args: [--unsafe]
      - id: check-toml
        files: ^code/
      - id: check-added-large-files
        files: ^code/
      - id: check-merge-conflict
        files: ^code/
      - id: detect-private-key
        files: ^code/

  # Lint + format (Ruff substitui Flake8/isort/pyupgrade/Black).
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
        files: ^code/
      - id: ruff-format
        files: ^code/

  # Checagem estatica de tipos (so o codigo-fonte do projeto).
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        files: ^code/src/
        additional_dependencies: []

  # SAST: padroes inseguros no codigo (roda a partir de code/, so em code/src).
  - repo: local
    hooks:
      - id: bandit
        name: bandit (SAST)
        entry: bash -c 'cd code && uv run bandit -c pyproject.toml -r src'
        language: system
        pass_filenames: false
        always_run: true

  # Impede que segredos vazem em commit (escopado ao projeto).
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks
        files: ^code/

  # Arquitetura: garante a direcao de dependencia das camadas.
  # Roda a partir de code/ para achar o importlinter.ini relativo.
  - repo: local
    hooks:
      - id: import-linter
        name: import-linter (contratos de arquitetura)
        entry: bash -c 'cd code && uv run lint-imports --config importlinter.ini'
        language: system
        pass_filenames: false
        always_run: true

  # Conventional Commits (valida a mensagem de commit).
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v3.29.1
    hooks:
      - id: commitizen
        stages: [commit-msg]
