AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >-
  QA Platform — bootstrap do ambiente executável. Expõe uma única rota HTTP de
  saúde (GET /health) via API Gateway + Lambda (FastAPI adaptado por Mangum). As
  dependências de runtime são empacotadas em uma Lambda Layer separada; o artefato
  da função contém apenas o código da aplicação (Requisitos 4.1, 4.2, 4.3, 4.4, 4.5).

Parameters:
  ServiceVersion:
    Type: String
    Default: "0.1.0"
    MinLength: 1
    Description: Versão do serviço exposta no corpo da resposta de /health (SERVICE_VERSION).
  LogLevel:
    Type: String
    Default: "INFO"
    AllowedValues:
      - DEBUG
      - INFO
      - WARNING
      - ERROR
      - CRITICAL
    Description: Nível do logging estruturado (LOG_LEVEL).
  Environment:
    Type: String
    Default: "prod"
    MinLength: 1
    Description: "Rótulo do ambiente (ENVIRONMENT), ex.: local, dev, prod."

Globals:
  Function:
    Runtime: python3.12
    Timeout: 30
    MemorySize: 512
    Architectures:
      - x86_64

Resources:
  # Dependências de runtime empacotadas SEPARADAMENTE do código da aplicação
  # (Requisito 4.4). O ContentUri aponta para layers/runtime-deps/ (task 15.2 cria
  # o requirements.txt). BuildMethod instrui o SAM a instalar as deps no runtime alvo.
  RuntimeDepsLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub "${AWS::StackName}-runtime-deps"
      Description: Dependências de runtime da QA Platform (FastAPI, Mangum, Pydantic, ...).
      ContentUri: layers/runtime-deps/
      CompatibleRuntimes:
        - python3.12
      RetentionPolicy: Delete
    Metadata:
      BuildMethod: python3.12

  # Tabela de histórico de runs (persistência durável do RunResult — Req 5.1).
  # Chave de partição = run_id (S); cobrança sob demanda (PAY_PER_REQUEST) para escalar
  # a zero sem provisionamento; criptografia em repouso habilitada (SSESpecification)
  # conforme Well-Architected (segurança) e a steering de templates SAM.
  RunHistoryTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-run-history"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: run_id
          AttributeType: S
      KeySchema:
        - AttributeName: run_id
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true

  # Exatamente UMA função Lambda (Requisito 4.1). O CodeUri é src/ para que o pacote
  # `qa_platform` seja importável e o Handler resolva o ponto de entrada Mangum. O
  # artefato contém apenas o código da aplicação — nenhuma dependência de runtime é
  # duplicada aqui (elas vivem só na Layer — Requisito 4.4).
  QaPlatformFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-api"
      CodeUri: src/
      Handler: qa_platform.interface.api.main.handler
      Layers:
        - !Ref RuntimeDepsLayer
      Environment:
        # Toda variável obrigatória declarada com nome e valor NÃO vazio (Requisito 4.5).
        # SERVICE_VERSION é obrigatória; LOG_LEVEL/ENVIRONMENT têm default seguro não vazio.
        # RUN_TABLE_NAME expõe o nome da tabela de histórico ao serviço (Req 5.1).
        Variables:
          SERVICE_VERSION: !Ref ServiceVersion
          LOG_LEVEL: !Ref LogLevel
          ENVIRONMENT: !Ref Environment
          RUN_TABLE_NAME: !Ref RunHistoryTable
      # Menor privilégio (Req 5.3): a função só pode ler/gravar itens na tabela de
      # histórico de runs — apenas GetItem/PutItem, sem Scan/Query/Delete/UpdateItem,
      # e restrito ao ARN da própria tabela (sem Resource: "*").
      Policies:
        - Statement:
            - Sid: RunHistoryTableReadWriteItem
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
              Resource: !GetAtt RunHistoryTable.Arn
      Events:
        # Único evento declarado: roteia GET /health para a função (Requisito 4.2).
        # Nenhuma outra rota é declarada, então caminhos/métodos não definidos são
        # rejeitados pelo API Gateway com 403/404 sem invocar a Lambda (Requisito 4.3).
        HealthGet:
          Type: Api
          Properties:
            Path: /health
            Method: get

Outputs:
  HealthUrl:
    Description: URL pública da rota de saúde GET /health.
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/health"
  FunctionArn:
    Description: ARN da função Lambda da QA Platform.
    Value: !GetAtt QaPlatformFunction.Arn
  RuntimeDepsLayerArn:
    Description: ARN da Layer de dependências de runtime.
    Value: !Ref RuntimeDepsLayer
  RunHistoryTableName:
    Description: Nome da tabela DynamoDB de histórico de runs (RUN_TABLE_NAME).
    Value: !Ref RunHistoryTable
  RunHistoryTableArn:
    Description: ARN da tabela DynamoDB de histórico de runs.
    Value: !GetAtt RunHistoryTable.Arn
