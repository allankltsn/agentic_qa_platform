[project]
name = "qa-platform"
version = "0.2.0"
description = "QA Platform backend — bootstrap do ambiente executável (esqueleto FastAPI + Lambda)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }

# Dependências de runtime da aplicação, com versões EXATAS fixadas (Req 5.4).
# fastapi/uvicorn/pydantic sustentam a app HTTP; mangum adapta a app para o AWS Lambda.
# agno: framework de orquestração (Workflow-first, ADR-001), confinado à infraestrutura.
# pyyaml: parser do manifesto qa-target.yaml, confinado à infraestrutura.
dependencies = [
    "fastapi==0.115.6",
    "mangum==0.19.0",
    "pydantic==2.10.4",
    "uvicorn==0.34.0",
    "agno==2.9.0",
    "pyyaml==6.0.3",
]

[project.optional-dependencies]
# Dependências opcionais de runtime, carregadas por import tardio quando usadas.
# boto3: só no adapter de Secrets Manager. opentelemetry: só quando o tracing liga.
aws = [
    "boto3==1.35.90",
]
# SDKs dos providers de LLM do enricher (Fase 2). Import tardio dentro do
# LLMEnricher: só são necessários quando MODEL_PROVIDER seleciona o provider
# correspondente. Agno importa esses SDKs lazily ao instanciar o modelo, então a
# ausência só falha na execução real (tratada como EnrichmentError).
# - openai: provider OpenAI. O SDK `openai` também é dependência TRANSITIVA do
#   provider Ollama do Agno: importar `agno.models.ollama` executa o
#   `__init__` do pacote, que puxa `agno.models.openai`. Por isso o extra
#   `ollama` inclui `openai`.
# - ollama: provider local (docker-compose, perfil `llm`), lê OLLAMA_HOST.
# - gemini: provider Gemini (Developer API), lê GOOGLE_API_KEY.
openai = [
    "openai==3.13.0",
]
ollama = [
    "ollama==0.6.2",
    # Dependência transitiva do import do provider Ollama do Agno (ver acima).
    "openai==3.13.0",
]
gemini = [
    # Série 1.x: aceita pydantic>=2.9.0 (compatível com pydantic==2.10.4 do
    # projeto). A série 2.x exige pydantic>=2.12.5, incompatível com o pin atual.
    # Satisfaz o mínimo do Agno (google-genai>=1.52.0 no extra `google`).
    "google-genai==1.75.0",
]
otel = [
    "opentelemetry-api==1.29.0",
    "opentelemetry-sdk==1.29.0",
    "opentelemetry-exporter-otlp-proto-grpc==1.29.0",
]

[dependency-groups]
# Dependências de desenvolvimento/teste (uv dependency groups), versões exatas.
dev = [
    "pytest>=8.0",
    "hypothesis>=6.0",
    "import-linter>=2.0",
    # moto: simula DynamoDB em memoria (sem rede) nos testes do adapter duravel;
    # versao EXATA fixada, compativel com boto3==1.35.90. Import tardio nos testes.
    "moto==5.0.28",
    "httpx==0.28.1",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "bandit[toml]>=1.7",
    "pip-audit>=2.7",
    "radon>=6.0",
    "xenon>=0.9",
    "pre-commit>=3.8",
    "commitizen>=3.29",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qa_platform"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
# reportlab (usado apenas por generate_quality_report.py, via `uv run --with`
# efemero) nao publica type stubs. Ignora somente esse pacote sem afrouxar a
# checagem de tipos do resto do projeto.
[[tool.mypy.overrides]]
module = ["reportlab.*"]
ignore_missing_imports = true

# PyYAML (importado como `yaml`) nao publica type stubs no pacote runtime; o
# parser do manifesto (infrastructure/manifest/parser.py) e o unico ponto que o
# importa. Ignora somente as stubs ausentes desse pacote sem afrouxar a checagem
# de tipos do resto do projeto.
[[tool.mypy.overrides]]
module = ["yaml"]
ignore_missing_imports = true

# boto3/botocore (extra `aws`) nao publicam type stubs / py.typed, e
# opentelemetry (extra `otel`) e opcional e pode nao estar instalado no venv
# default. Ambos sao libs de fronteira, confinadas a infrastructure/. Ignora as
# stubs/imports ausentes desses pacotes sem afrouxar a checagem do resto do
# projeto (alinha o `mypy src` local ao gate do pre-commit).
[[tool.mypy.overrides]]
module = ["boto3", "botocore.*", "opentelemetry.*"]
ignore_missing_imports = true
