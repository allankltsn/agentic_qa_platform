[importlinter]
root_package = qa_platform
include_external_packages = True

# Contrato 1 — Camadas (ports & adapters).
# Dependência aponta sempre para dentro: interface -> application -> domain.
# 'domain' fica na base: não importa application, infrastructure nem interface.
[importlinter:contract:camadas]
name = Camadas (domain isolado; dependência aponta para dentro)
type = layers
layers =
    qa_platform.interface
    qa_platform.application
    qa_platform.domain

# Contrato 2 — 'domain' isolado de frameworks web e infraestrutura.
# O domínio é puro: nada de FastAPI/Starlette/Pydantic/uvicorn nem infraestrutura.
# Inclui 'agno' (framework de orquestração) e 'yaml' (parser do manifesto
# qa-target.yaml). O parser YAML é o PyYAML (dependência única em pyproject.toml),
# importado como 'yaml'; por isso não há entrada 'ruamel' — o projeto não usa
# ruamel.yaml (Req 12.1).
[importlinter:contract:domain-puro]
name = domain nao importa framework web nem infraestrutura
type = forbidden
source_modules =
    qa_platform.domain
forbidden_modules =
    qa_platform.application
    qa_platform.infrastructure
    qa_platform.interface
    fastapi
    starlette
    pydantic
    uvicorn
    mangum
    boto3
    agno
    yaml

# Contrato 3 — boto3 confinado aos adapters de infraestrutura.
# Somente adapters de infraestrutura podem importar boto3 — hoje
# qa_platform.infrastructure.secrets.aws_secrets_manager (Secrets Manager) e
# qa_platform.infrastructure.persistence.dynamodb_run_store (store durável de run);
# domain e interface nunca o importam DIRETAMENTE. Usa-se allow_indirect_imports
# porque a interface pode alcançar esses adapters (que fazem import tardio de boto3)
# por meio do composition_root — cadeia legítima de wiring; o que a regra proíbe é o
# import direto de boto3 em domain/interface (Req 6.2, 6.3).
[importlinter:contract:boto3-confinado]
name = boto3 confinado aos adapters de infraestrutura
type = forbidden
allow_indirect_imports = True
source_modules =
    qa_platform.domain
    qa_platform.interface
forbidden_modules =
    boto3

# Contrato 4 — Agno confinado aos adapters de orquestração/camadas de QA.
# Somente qa_platform.infrastructure.orchestration.* e
# qa_platform.infrastructure.layers.* podem importar 'agno'; domain e interface
# nunca o importam DIRETAMENTE. Usa-se allow_indirect_imports porque a interface
# alcança o Workflow (adapter Agno) por meio do composition_root — cadeia legítima
# de wiring; o que a regra proíbe é o import direto de 'agno' em domain/interface,
# mantendo os tipos do framework de orquestração fora do domínio (Req 12.1–12.4).
[importlinter:contract:agno-confinado]
name = agno confinado aos adapters de orquestracao e camadas de QA
type = forbidden
allow_indirect_imports = True
source_modules =
    qa_platform.domain
    qa_platform.interface
forbidden_modules =
    agno
